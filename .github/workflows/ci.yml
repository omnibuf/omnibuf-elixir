name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Format, Lint, Build, Test & Conformance
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools via mise
        uses: jdx/mise-action@v5
        with:
          install: true

      - name: Install Hex, Rebar & fetch dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Install conformance-runner
        run: |
          mise use -g go@1.25
          GOBIN="$HOME/.local/bin" mise exec -- go install github.com/omnibuf/omnibuf-go/cmd/conformance-runner@71dad83aadd7dc65401d662521d34cfaeb1011ab
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run full CI suite
        run: |
          just fmt-check
          just lint
          just build
          OMNIBUF_NATIVE=0 mix test --trace
          OMNIBUF_NATIVE=1 mix test --trace
          OMNIBUF_NATIVE=0 just conformance
          OMNIBUF_NATIVE=1 just conformance
